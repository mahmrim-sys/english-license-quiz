      font-weight: 600;
      cursor: pointer;

    .btn-next, .btn-submit {

      color: white;
    }

    .btn-submit:hover { background: #1b5e20; }

      text-align: center;
      padding: 40px 30px;

      {
        q: "Which of the following is an example of a productive skill?",
        options: ["Listening", "Reading", "Writing", "Both A and B"],
        correct: 2
      },
      {
        q: "A teacher notices that students use L1 excessively during group work. An effective strategy is:",
        options: ["Setting clear expectations and monitoring", "Banning group work completely", "Ignoring the issue", "Speaking only in L1"],
        correct: 0
      },
      {
        q: "The ultimate goal of language teaching according to the communicative approach is:",
        options: ["Native-like accuracy in all situations", "Communicative competence (ability to use language appropriately and effectively)", "Perfect knowledge of grammar rules only", "Ability to translate literary texts"],
        correct: 1
      }
    ];

    let current = 0;
    let answers = new Array(questions.length).fill(null);

    const quizEl = document.getElementById('quiz');
    const progressEl = document.getElementById('progress');
    const resultsEl = document.getElementById('results');

    function renderQuestion() {
      const q = questions[current];
      let html = `
        <div class="question-card active">
          <div>
            <span class="q-number">${current + 1}</span>
            <span style="color:#666;font-size:0.9rem;">من ${questions.length}</span>
          </div>
          <div class="question-text">${q.q}</div>
          <div class="options">
      `;
      q.options.forEach((opt, i) => {
        const checked = answers[current] === i ? 'checked' : '';
        html += `
          <label>
            <input type="radio" name="q${current}" value="${i}" ${checked} onchange="selectAnswer(${i})">
            <span>${String.fromCharCode(65 + i)}) ${opt}</span>
          </label>
        `;
      });
      html += `
          </div>
          <div class="nav-buttons">
            <button class="btn-prev" onclick="prevQ()" ${current === 0 ? 'disabled style="opacity:0.5"' : ''}>السابق</button>
            ${current === questions.length - 1 
              ? '<button class="btn-submit" onclick="submitQuiz()">تسليم الاختبار</button>'
              : '<button class="btn-next" onclick="nextQ()">التالي</button>'}
          </div>
        </div>
      `;
      quizEl.innerHTML = html;
      updateProgress();
    }

    function selectAnswer(idx) {
      answers[current] = idx;
    }

    function nextQ() {
      if (current < questions.length - 1) {
        current++;
        renderQuestion();
      }
    }

    function prevQ() {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    }

    function updateProgress() {
      const percent = ((current + 1) / questions.length) * 100;
      progressEl.style.width = percent + '%';
    }

    function submitQuiz() {
      let score = 0;
      let reviewHtml = '<h3 style="margin-bottom:15px;color:#1a237e;">مراجعة الإجابات</h3>';

      questions.forEach((q, i) => {
        const userAns = answers[i];
        const isCorrect = userAns === q.correct;
        if (isCorrect) score++;

        reviewHtml += `
          <div class="review-item ${isCorrect ? 'correct' : 'wrong'}">
            <div class="q">${i + 1}. ${q.q}</div>
            <div class="user">إجابتك: ${userAns !== null ? String.fromCharCode(65 + userAns) + ') ' + q.options[userAns] : 'لم تجب'}</div>
            ${!isCorrect ? `<div class="correct-ans">الإجابة الصحيحة: ${String.fromCharCode(65 + q.correct)}) ${q.options[q.correct]}</div>` : ''}
          </div>
        `;
      });

      document.getElementById('scoreValue').textContent = score;
      const percent = Math.round((score / questions.length) * 100);
      let msg = '';
      if (percent >= 80) msg = 'ممتاز! أداء قوي جداً 👏';
      else if (percent >= 65) msg = 'جيد جداً، استمر في التدريب 💪';
      else if (percent >= 50) msg = 'مقبول، ركز على نقاط الضعف';
      else msg = 'تحتاج مزيداً من المراجعة والتدريب';

      document.getElementById('resultMsg').textContent = `درجتك: ${score} من 88 (${percent}%) — ${msg}`;
      document.getElementById('review').innerHTML = reviewHtml;

      quizEl.style.display = 'none';
      resultsEl.style.display = 'block';
      window.scrollTo(0, 0);
    }

    // Start
    renderQuestion();
  </script>
